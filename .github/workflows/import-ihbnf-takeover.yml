name: Import IHBNF takeover ZIP

on:
  push:
    branches: [main]
    paths:
      - ".takeover/**"
      - ".github/workflows/import-ihbnf-takeover.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for all ZIP chunks
        id: parts
        shell: bash
        run: |
          count=$(find .takeover -maxdepth 1 -type f -name 'chunk-*.txt' 2>/dev/null | wc -l)
          if [[ "$count" -eq 30 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruct and import website
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          find .takeover -maxdepth 1 -type f -name 'chunk-*.txt' | sort | xargs cat | base64 -d > /tmp/ihbnf.zip
          rm -rf /tmp/ihbnf-unpack
          mkdir -p /tmp/ihbnf-unpack
          unzip -q /tmp/ihbnf.zip -d /tmp/ihbnf-unpack
          test -f /tmp/ihbnf-unpack/ihbnf/package.json
          rm -rf /tmp/ihbnf-unpack/ihbnf/.git
          cp -a /tmp/ihbnf-unpack/ihbnf/. .
          rm -rf .takeover
          git config user.name "IHBNF Takeover"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import."
            exit 0
          fi
          git commit -m "Import complete IHBNF website from Emergent export"
          git push
